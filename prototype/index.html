<title>운명의 문 랜딩 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-sized stage; scene art fills it, 노엘's line + input sit in a glass panel on the lower third. Single dark theme on purpose (candlelit ballroom). */
:root {
  --night: #0b0a10;
  --ink: #f4ecdf;
  --ink-dim: #b9ad9c;
  --gold: #e6c27a;
  --gold-deep: #a9813f;
  --glass: rgba(14, 11, 20, 0.62);
  --line: rgba(230, 194, 122, 0.45);
  --wine: #6e1d2a;
  --f-voice: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --f-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--f-ui);
  display: flex; justify-content: center;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}
.stage {
  position: relative; width: 100%; max-width: 480px; height: 100%; min-height: 560px;
  overflow: hidden; background: var(--night);
}
.bg { position: absolute; inset: 0; }
.bg img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%;
  opacity: 0; transition: opacity .9s ease; transform: scale(1.04);
}
.bg img.on { opacity: 1; animation: drift 14s ease-out forwards; }
@keyframes drift { from { transform: scale(1.04); } to { transform: scale(1.12); } }
.shade {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to bottom, rgba(11,10,16,.35) 0%, rgba(11,10,16,0) 22%, rgba(11,10,16,0) 45%, rgba(11,10,16,.85) 72%, var(--night) 100%);
}
.dust { position: absolute; inset: 0; pointer-events: none; }
.tag {
  position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px; z-index: 5;
  font-size: 11px; letter-spacing: .08em; color: var(--ink-dim);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: rgba(11,10,16,.5);
}
.restart {
  position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 16px; z-index: 5;
  font: 500 12px var(--f-ui); color: var(--ink-dim); background: none; border: none; padding: 6px; cursor: pointer;
}
.logo {
  position: absolute; left: 0; right: 0; top: calc(9% + env(safe-area-inset-top, 0px)); z-index: 4; text-align: center;
  font-family: var(--f-voice); font-weight: 800; line-height: 1.25;
  color: var(--gold); text-shadow: 0 0 18px rgba(230,194,122,.55), 0 2px 6px rgba(0,0,0,.8);
  transition: opacity .6s;
}
.logo small { display: block; font-size: 18px; font-weight: 700; color: var(--ink); letter-spacing: .04em; }
.logo span { display: block; font-size: 34px; letter-spacing: .02em; }
.logo i { display: block; width: 140px; height: 1px; margin: 12px auto 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.panel {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
  padding: 0 16px calc(22px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 14px;
}
.speaker { font: 700 12px var(--f-ui); letter-spacing: .18em; color: var(--gold); }
.line {
  font-family: var(--f-voice); font-weight: 700; font-size: 21px; line-height: 1.55; min-height: 2.6em;
  text-wrap: balance; text-shadow: 0 2px 8px rgba(0,0,0,.9);
}
.line.mono { font-weight: 400; color: var(--ink-dim); font-size: 18px; }
.sub { font-size: 14px; line-height: 1.6; color: var(--ink-dim); }
.box {
  background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: grid; gap: 12px;
}
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 0; min-width: 0; }
label.cap, span.cap { font-size: 12px; color: var(--ink-dim); letter-spacing: .04em; }
input, select {
  width: 100%; font: 500 17px var(--f-ui); color: var(--ink); background: rgba(255,255,255,.06);
  border: 1px solid rgba(230,194,122,.3); border-radius: 10px; padding: 12px 12px; outline: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%);
  background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
input:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(230,194,122,.18); }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip {
  font: 500 15px var(--f-ui); color: var(--ink); background: rgba(255,255,255,.05);
  border: 1px solid rgba(230,194,122,.3); border-radius: 10px; padding: 12px 8px; cursor: pointer;
}
.chip[aria-pressed="true"] { border-color: var(--gold); background: rgba(230,194,122,.16); color: var(--gold); }
.btn {
  font: 700 16px var(--f-ui); letter-spacing: .02em; color: #1a1208; cursor: pointer;
  background: linear-gradient(180deg, #f0d293, var(--gold) 55%, var(--gold-deep));
  border: none; border-radius: 12px; padding: 15px 16px; width: 100%;
  box-shadow: 0 6px 22px rgba(230,194,122,.25);
}
.btn[disabled] { opacity: .4; cursor: default; box-shadow: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.err { font-size: 13px; color: #f1a7a7; min-height: 1em; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-dim); cursor: pointer; }
.check input { width: 18px; height: 18px; padding: 0; accent-color: var(--gold); appearance: auto; }
.key {
  display: flex; align-items: center; gap: 10px; font-family: var(--f-voice); font-weight: 700; color: var(--gold); font-size: 15px;
}
.key b { flex: 1; height: 2px; background: linear-gradient(90deg, var(--gold), rgba(230,194,122,.1)); border-radius: 2px; position: relative; overflow: hidden; }
.key b::after { content: ""; position: absolute; inset: 0; width: 0; background: #fff6dc; animation: fill 3s ease-in-out forwards; }
@keyframes fill { to { width: 100%; } }
.card { display: grid; gap: 6px; }
.card dt { font-size: 12px; color: var(--ink-dim); letter-spacing: .06em; }
.card dd { margin: 0; font-family: var(--f-voice); font-weight: 700; font-size: 18px; color: var(--ink); }
.blur { filter: blur(6px); user-select: none; }
.note { font-size: 12px; color: var(--ink-dim); text-align: center; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(230,194,122,.25); }
.dots i.on { background: var(--gold); }
.fade { animation: rise .5s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.panel.tall { top: calc(52px + env(safe-area-inset-top, 0px)); overflow-y: auto; align-content: end; padding-top: 24px;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 28px); mask-image: linear-gradient(to bottom, transparent 0, #000 28px); }
.plate { background: linear-gradient(180deg, rgba(58,22,30,.92), rgba(30,12,18,.94)); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; display: grid; gap: 14px; }
.plate h3 { margin: 0; text-align: center; font: 800 19px var(--f-voice); color: var(--gold); letter-spacing: .04em; }
.plate h3 small { display: block; font: 500 12px var(--f-ui); color: var(--ink-dim); letter-spacing: .12em; margin-bottom: 4px; }
.plate p { margin: 0; font: 400 15.5px/1.75 var(--f-voice); color: var(--ink); text-wrap: pretty; }
.plate p b { color: var(--gold); font-weight: 800; }
.pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.pillars .lb { font-size: 11px; color: var(--ink-dim); }
.pillars .ch { aspect-ratio: 1; display: grid; place-items: center; border-radius: 8px; font: 800 26px var(--f-voice); color: #140c06;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
.pillars .ch.q { background: rgba(255,255,255,.06); color: var(--ink-dim); font-size: 18px; }
.e0 { background: linear-gradient(160deg, #8fbf8a, #3f6f45); } .e1 { background: linear-gradient(160deg, #e57a6d, #8f2b2b); }
.e2 { background: linear-gradient(160deg, #e9cd8a, #a67c35); } .e3 { background: linear-gradient(160deg, #f2f0ea, #9a978f); }
.e4 { background: linear-gradient(160deg, #6f8fc4, #23365f); color: #f4ecdf !important; }
.door { display: flex; align-items: center; gap: 10px; font: 700 13px var(--f-ui); color: var(--gold); letter-spacing: .06em; }
.door i { font-style: normal; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
/* ---- webtoon scroll (results) ---- */
.toon { position: absolute; inset: 0; z-index: 4; overflow-y: auto; overscroll-behavior: contain; background: var(--night); -webkit-overflow-scrolling: touch; }
.pn { position: relative; width: 100%; aspect-ratio: 9 / 14; overflow: hidden; }
.pn img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 80%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 80%, transparent 100%); }
.pn.short { aspect-ratio: 9 / 10; }
.pn.angel { aspect-ratio: 9 / 15; background: radial-gradient(55% 45% at 50% 38%, #fffaf0 0%, #f1dfb4 28%, #6a5a6e 62%, #141224 100%); }
.bb { position: absolute; max-width: 72%; padding: 13px 18px; border-radius: 22px;
  background: rgba(14, 11, 20, .74); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font: 700 17px/1.55 var(--f-voice); color: var(--ink); text-wrap: balance; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.bb.l { left: 16px; border-bottom-left-radius: 6px; } .bb.r { right: 16px; border-bottom-right-radius: 6px; text-align: right; }
.bb.big { font-size: 20px; }
.sec { padding: 8px 16px 28px; display: grid; gap: 14px; }
.say { font: 700 19px/1.6 var(--f-voice); text-align: center; color: var(--ink); text-wrap: balance; padding: 28px 8px; }
.say small { display: block; font: 500 12px var(--f-ui); letter-spacing: .18em; color: var(--gold); margin-bottom: 8px; }
.story .chap { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; padding-top: 12px; border-top: 1px dashed var(--line); }
.story .chap b.mo { font: 800 15px var(--f-voice); color: var(--gold); padding-top: 2px; }
.story .chap.hl p { font-weight: 700; }
.story .chap em { display: block; font: 600 11px var(--f-ui); font-style: normal; color: var(--gold); letter-spacing: .08em; margin-bottom: 2px; }
.story .end { text-align: center; padding-top: 12px; border-top: 1px dashed var(--line); }
.dcard { border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: linear-gradient(180deg, rgba(40,24,30,.9), rgba(18,12,18,.94)); display: grid; gap: 12px; }
.dcard p { margin: 0; font: 700 17px/1.6 var(--f-voice); }
.dcard .rx { font: 400 15px/1.6 var(--f-voice); color: var(--gold); }
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.toc li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-size: 15px; line-height: 1.5; }
.toc li i { font-style: normal; color: var(--gold); font-weight: 700; }
.toc li span b { display: block; color: var(--ink); } .toc li span em { font-style: normal; color: var(--ink-dim); filter: blur(5px); user-select: none; }
.ctabar { position: sticky; bottom: 0; z-index: 2; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, rgba(11,10,16,0), var(--night) 40%); transform: translateY(110%); transition: transform .4s ease; }
.ctabar.on { transform: none; }
.rv { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s ease; }
.rv.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } .ctabar { transition: none; } }
.els { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; align-items: end; text-align: center; padding: 4px 0; }
.els span { display: block; width: 60%; margin: 0 auto 6px; border-radius: 4px 4px 2px 2px; }
.els b { display: block; font: 500 12px var(--f-ui); color: var(--ink-dim); } .els i { font: 700 13px var(--f-ui); font-style: normal; color: var(--gold); }
.chat { display: grid; gap: 10px; }
#ask .err:empty { display: none; }
.chips.col { grid-template-columns: 1fr; }
.tagline { margin: 0; text-align: center; font: 500 14px var(--f-ui); color: var(--ink-dim); letter-spacing: .08em; }
#af .cap { margin-bottom: -6px; }
#ask textarea { width: 100%; font: 500 16px/1.5 var(--f-ui); color: var(--ink); background: rgba(255,255,255,.06); border: 1px solid rgba(230,194,122,.3); border-radius: 10px; padding: 12px; resize: none; outline: none; }
#ask textarea:focus { border-color: var(--gold); }
.msg.me { cursor: pointer; }
.msg.me:hover { background: rgba(230,194,122,.26); }
.backrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.backrow span { font-size: 11.5px; color: var(--ink-dim); opacity: .8; }
.back { justify-self: start; background: none; border: none; padding: 4px 2px; font: 500 13px var(--f-ui); color: var(--ink-dim); cursor: pointer; }

.msg { margin: 0; max-width: 82%; padding: 11px 15px; border-radius: 18px; font: 700 16.5px/1.55 var(--f-voice); text-wrap: pretty; }
.msg.g { justify-self: start; background: var(--glass); border: 1px solid var(--line); border-bottom-left-radius: 6px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); min-height: 1.55em; }
.msg.me { justify-self: end; background: rgba(230,194,122,.16); border: 1px solid var(--gold); color: var(--gold); font: 500 15.5px/1.5 var(--f-ui); border-bottom-right-radius: 6px; }
.row .send { flex: 0 0 auto; width: auto; padding: 12px 16px; }
input[type=date], input[type=time] { color-scheme: dark; min-height: 48px; }
.plate .lead { font-size: 17px; text-align: center; }
.heard { display: grid; gap: 8px; padding: 14px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px dashed rgba(230,194,122,.35); }
.heard small { font: 500 12px var(--f-ui); color: var(--ink-dim); letter-spacing: .04em; }
.heard q { font: 800 18px/1.45 var(--f-voice); color: var(--ink); quotes: '“' '”'; }
.plate .inner { font-weight: 700; color: var(--gold); }
.beats { display: grid; gap: 0; padding: 0 16px 8px; }
.beat { margin: 0; padding: 26px 8px; text-align: center; font: 700 19px/1.65 var(--f-voice); color: var(--ink); text-wrap: balance; }
.beat b { color: var(--gold); font-weight: 800; }
.beat.big { font-size: 25px; padding: 40px 8px; }
.beat small { display: block; font: 500 14px var(--f-ui); color: var(--ink-dim); margin-bottom: 8px; }
.beat.pill { font: 800 22px/1.5 var(--f-voice); color: var(--gold); letter-spacing: .06em; text-shadow: 0 0 18px rgba(230,194,122,.35); }
.hanja { display: grid; place-items: center; gap: 4px; padding: 40px 0 8px; }
.hanja b { font: 800 72px/1 var(--f-voice); color: var(--gold); text-shadow: 0 0 24px rgba(230,194,122,.45); }
.hanja span { font: 500 13px var(--f-ui); color: var(--ink-dim); letter-spacing: .2em; }
.orns { display: flex; justify-content: center; gap: 22px; padding: 6px 0 10px; }
.ball { width: 64px; height: 64px; border-radius: 50%; border: none; cursor: pointer; position: relative;
  background: radial-gradient(circle at 32% 30%, #fff8 0, transparent 22%), radial-gradient(circle at 50% 55%, var(--c), #0008 120%);
  box-shadow: 0 6px 18px rgba(0,0,0,.5), 0 0 14px color-mix(in srgb, var(--c) 50%, transparent); transition: transform .3s, opacity .3s; }
.ball::before { content: ""; position: absolute; top: -9px; left: 50%; width: 14px; height: 10px; margin-left: -7px; border-radius: 3px; background: linear-gradient(#f0d293, #a9813f); }
.ball:hover:not(:disabled) { transform: translateY(-4px) rotate(-4deg); }
.ball:disabled:not(.picked) { opacity: .3; cursor: default; } .ball.picked { transform: scale(1.12); }
.ocard p { margin: 0; font: 700 17px/1.6 var(--f-voice); }
.plate .why { font-weight: 700; color: var(--gold); text-align: center; padding-top: 6px; border-top: 1px solid var(--line); }
.profile dd.blur, .profile .blur { filter: blur(6px); user-select: none; }
.profile { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(230,194,122,.25), 0 0 32px rgba(230,194,122,.18); background: linear-gradient(180deg, rgba(58,22,30,.92), rgba(20,12,18,.95)); }
.profile dd { font-size: 19px; }
.face { position: relative; aspect-ratio: 4 / 5; border-radius: 16px; overflow: hidden; border: 1px solid var(--gold); margin-bottom: 14px; }
.face .fimg { position: absolute; inset: -20px; filter: blur(14px); background: radial-gradient(circle at 50% 36%, #e2c2a8 0 16%, transparent 17%), radial-gradient(ellipse at 50% 28%, #2a1a1a 0 22%, transparent 23%), radial-gradient(ellipse at 50% 98%, #5a3a44 0 40%, transparent 41%), linear-gradient(#4a3040, #160e14); }
.face::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 55%, rgba(10,8,14,.85)); }
.face b { z-index: 1; position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font: 700 15px var(--f-voice); color: var(--gold); text-shadow: 0 2px 8px #000; }
.read { display: grid; gap: 10px; padding: 20px 18px; border-left: 2px solid var(--gold); background: rgba(255,255,255,.03); }
.read p { margin: 0; font: 700 17px/1.7 var(--f-voice); color: var(--ink); }
.read b { color: var(--gold); font-weight: 800; }
.pro { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; padding: 24px; cursor: pointer;
  background: radial-gradient(1px 1px at 20% 30%, #fff 50%, transparent), radial-gradient(1px 1px at 70% 20%, #fff 50%, transparent), radial-gradient(1.5px 1.5px at 40% 70%, #fff 50%, transparent),
    radial-gradient(1px 1px at 85% 60%, #fffb 50%, transparent), radial-gradient(2px 2px at 55% 15%, #ffe9b0 50%, transparent), radial-gradient(1px 1px at 10% 80%, #fff9 50%, transparent),
    radial-gradient(120% 80% at 50% 0%, #1b2140 0%, #0b0a10 70%); }
.pline { margin: 0; text-align: center; font: 700 20px/1.75 var(--f-voice); color: var(--ink); text-wrap: balance; opacity: 0; transform: translateY(10px); }
.pline.on { animation: rise 1.2s ease forwards; } .pline b { color: var(--gold); }
.pcut { position: absolute; top: calc(52px + env(safe-area-inset-top, 0px)); left: 16px; font: 500 11px var(--f-ui); color: var(--ink-dim); border: 1px dashed var(--line); border-radius: 999px; padding: 2px 8px; }
.ptap { position: absolute; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); margin: 0; font: 500 12px var(--f-ui); color: var(--ink-dim); }
.pskip { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 16px; z-index: 9; font: 500 12px var(--f-ui); color: var(--ink-dim); background: rgba(11,10,16,.6); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.pro.toon { z-index: 8; }
.pp { position: relative; width: 100%; margin-bottom: 14px; overflow: visible; background: #141224; }
.pp:last-of-type { margin-bottom: 0; }
/* 프롤로그 모션: 켄번스, 눈, 깃털, 빛 맥동, 흔들림 */
.ppi { position: absolute; inset: 0; overflow: hidden; }
.ppi img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; transform: scale(1.0); transform-origin: var(--ox,50%) var(--oy,40%); }
.pp.in .ppi img { animation: kb 14s ease-out forwards; }
@keyframes kb { from { transform: scale(1.0) translate(0,0); } to { transform: scale(1.12) translate(var(--kx,0), var(--ky,-2%)); } }
.snow { position: absolute; inset: 0; pointer-events: none; opacity: .75;
  background-image: radial-gradient(2px 2px at 20px 30px, #fff, transparent 60%), radial-gradient(1.5px 1.5px at 80px 120px, #fff, transparent 60%), radial-gradient(2.5px 2.5px at 150px 60px, rgba(255,255,255,.9), transparent 60%), radial-gradient(1.5px 1.5px at 200px 180px, #fff, transparent 60%), radial-gradient(2px 2px at 260px 90px, rgba(255,255,255,.85), transparent 60%);
  background-size: 300px 220px; animation: snow 9s linear infinite; }
.snow.s2 { opacity: .45; background-size: 180px 160px; animation-duration: 14s; filter: blur(.6px); }
@keyframes snow { from { background-position: 0 0; } to { background-position: 40px 220px; } }
.glow { position: absolute; width: 60%; aspect-ratio: 1; transform: translate(-50%,-50%); border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(circle, rgba(255,214,140,.75) 0%, rgba(255,190,100,.25) 35%, transparent 70%); animation: glow 3.2s ease-in-out infinite; }
@keyframes glow { 0%,100% { opacity: .35; transform: translate(-50%,-50%) scale(.92); } 50% { opacity: .9; transform: translate(-50%,-50%) scale(1.06); } }
.feather { position: absolute; width: 34px; height: 34px; pointer-events: none; z-index: 1; opacity: 0; filter: drop-shadow(0 0 6px rgba(255,236,190,.9)); }
.pp.in .feather { animation: fall 5.5s ease-in-out var(--fd,0s) infinite; }
@keyframes fall {

// ---- tiny audio: page-flip whoosh + key chime (only after a tap) ----
let ac = null;
function sfx(kind) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime;
    if (kind === 'flip') {
      const len = .28, buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = .7;
      const g = ac.createGain(); g.gain.value = .18;
      src.connect(f).connect(g).connect(ac.destination); src.start(t);
    } else {
      [1318.5, 1760, 2637].forEach((fr, i) => {
        const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = fr;
        g.gain.setValueAtTime(0, t + i * .09); g.gain.linearRampToValueAtTime(.07, t + i * .09 + .01);
        g.gain.exponentialRampToValueAtTime(.0001, t + i * .09 + 1.4);
        o.connect(g).connect(ac.destination); o.start(t + i * .09); o.stop(t + i * .09 + 1.5);
      });
    }
  } catch (e) {}
}

// ---- typewriter for 노엘's lines ----
let typing = null;
function type(el, text, speed = 45) {
  clearInterval(typing);
  if (reduce) { el.textContent = text; return Promise.resolve(); }
  el.textContent = ''; let i = 0;
  return new Promise(res => { typing = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) { clearInterval(typing); res(); } }, speed); });
}

function sijin(hhmm) {
  if (!hhmm) return null;
  const [h, m] = hhmm.split(':').map(Number), t = h * 60 + m;
  return { idx: Math.floor((((t - 30 + 60) % 1440) + 1440) % 1440 / 120), nextDay: t >= 23 * 60 + 30 };
}

// ---- 출생 시각 보정: 한국은 1961.8.10 전엔 UTC+8:30, 1960·1987·1988년 여름엔 서머타임이었다.
// 출생 당시 시계 시각을 지금의 한국 표준시(UTC+9) 기준으로 바꾼다. [이 시각(UTC 분) 전까지, 그때 시계의 UTC 오프셋(분)]
const KR_TZ = [[Date.UTC(1960, 3, 30, 16) / 60000, 510], [Date.UTC(1960, 8, 17, 15) / 60000, 570], [Date.UTC(1961, 7, 9, 16) / 60000, 510],
  [Date.UTC(1987, 4, 9, 17) / 60000, 540], [Date.UTC(1987, 9, 10, 17) / 60000, 600], [Date.UTC(1988, 4, 7, 17) / 60000, 540], [Date.UTC(1988, 9, 8, 17) / 60000, 600], [Infinity, 540]];
function toKST(y, m, d, hhmm) {
  if (!hhmm) return { y, m, d, time: '', shift: 0 };
  const [h, mi] = hhmm.split(':').map(Number), L = Date.UTC(y, m - 1, d, h, mi) / 60000;
  let off = 540;
  for (let i = 0, from = -Infinity; i < KR_TZ.length; from = KR_TZ[i][0], i++) { const u = L - KR_TZ[i][1]; if (u >= from && u < KR_TZ[i][0]) { off = KR_TZ[i][1]; break; } }
  const shift = 540 - off, t = new Date((L + shift) * 60000);
  return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(), time: `${String(t.getUTCHours()).padStart(2, '0')}:${String(t.getUTCMinutes()).padStart(2, '0')}`, shift };
}
function calc() {
  const K = S.adj = toKST(+S.y, +S.m, +S.d, S.noTime ? '' : S.time);
  const sj = S.noTime ? null : sijin(K.time);
  const tmin = K.time ? K.time.split(':').reduce((h, m) => +h * 60 + +m) : null;
  const P = SAJU.pillars(K.y, K.m, K.d, sj ? sj.idx : null, sj ? sj.nextDay : false, tmin), dG = P.D.g;
  const male = S.sex === '남자', queer = S.orient === 'queer', A = SAJU.analyze(P, male, queer), T = TXT;
  const loveFam = SAJU.fam(SAJU.god(dG, SAJU.JI_MAIN[P.D.j]));
  const yr = [...T.year[SAJU.elG(dG)]]; if (male && T.yearM[SAJU.elG(dG)]) yr[0] = T.yearM[SAJU.elG(dG)];
  const ls = queer && A.loveState === 'none' ? 'noneQ' : male && (A.loveState === 'none' || A.loveState === 'mixed') ? A.loveState + 'M' : A.loveState;
  const elLine = A.missing.length ? `넌 ${T.elName[A.missing[0]]} 기운이 비어 있어. ${T.missing[A.missing[0]]}`
    : A.heavy >= 0 ? `넌 ${T.elName[A.heavy]} 기운이 넘쳐. ${T.heavy[A.heavy]}` : '';
  S.R = {
    P, A, ilju: SAJU.GAN_K[dG] + SAJU.JI_K[P.D.j],
    image: `${T.season(P.M.j)} ${T.img[dG]}`, trait: T.trait[dG],
    gyeok: A.famN[SAJU.fam(A.gyeok)] >= 2 ? T.gyeok[A.gyeok] : '', strength: (A.ratio >= .55 || A.ratio <= .3) ? T.strength[A.strength] : '', elLine,
    love: [T.loveState[ls], A.natal ? T.natal[A.natal] : '', T.scene[S.status] || ''].filter(Boolean).join(' '),
    heard: (() => { const h = HEARD[dG]; const love = HEARD_LOVE[A.loveState] || (A.el[1] === 0 ? HEARD_LOVE.fire0 : A.el[1] >= (P.H ? 4 : 3) ? HEARD_LOVE.fire4 : h[1]); return { p: h[0], l: love, inner: h[2] }; })(),
    workLine: S.job ? `${WORK_PLACE[S.job]} ${WORK_LINE[SAJU.fam(SAJU.god(dG, 2))]}` : '',
    yearLine: `${yr[0]} ${T.yearTone[A.yearGood ? 1 : 0]}`, reframe: yr[1], wuLine: T.wu[[7, 0, 1].find(j => j === P.D.j)] || '',
    doors: SAJU.doors(P, male, queer), dec: SAJU.december(P, male, queer),
  };
}

function goQ(i) {

  const chat = document.getElementById('chat'), ask = document.getElementById('ask');
  const down = () => { panel.scrollTop = panel.scrollHeight; };
  const bubble = (cls, t) => { const p = document.createElement('p'); p.className = 'msg ' + cls; p.textContent = t; chat.append(p); return p; };
  const meBubble = (j, t) => {
    const p = document.createElement('button'); p.type = 'button'; p.className = 'msg me'; p.textContent = t; p.title = '눌러서 고치기';
    p.addEventListener('click', () => { sfx('flip'); goQ(j); }); chat.append(p); return p;
  };
  const say = async t => { const p = bubble('g', ''); down(); await type(p, t, 32); down(); };
  // 지난 대화는 그대로 다시 그린다
  chat.innerHTML = ''; ask.innerHTML = '';
  for (let j = 0; j < i; j++) { [].concat(QS[j].say()).forEach(t => bubble('g', t)); meBubble(j, ANS[j].show); }
  ANS.length = i;
  (async () => {
    for (const t of [].concat(QS[i].say())) { await say(t); if (my !== chatRun) return; await wait(180); }
    const q = QS[i];
    ask.innerHTML = `<form class="box fade" id="af">${q.html()}<p class="err" id="er"></p>${i > 0 ? '<div class="backrow"><button type="button" class="back" id="bk">← 이전으로</button><span>위의 내 답을 눌러도 고칠 수 있어요</span></div>' : ''}</form>`; down();
    const f = document.getElementById('af'); q.init?.(f);
    const done = async r => {
      if (my !== chatRun) return;
      sfx('flip'); q.apply(r); ask.innerHTML = '';
      ANS[i] = { show: r.show };
      meBubble(i, r.show); down(); await wait(250);
      if (S.fast) { S.fast = false; Object.assign(S, { status: S.status || 'solo', orient: S.orient || 'hetero', job: S.job || 'office', wk: S.wk || 'none' }); if (S.wk === 'none') S.worry = ''; }
      else if (i + 1 < QS.length) return goQ(i + 1);
      await say('"…알겠어. 잠깐만."'); if (my !== chatRun) return;
      await wait(500); panel.classList.remove('tall'); next(6, 'chime');
    };
    f.addEventListener('submit', e => { e.preventDefault(); const r = q.parse(f); typeof r === 'string' ? (document.getElementById('er').textContent = r) : done(r); });
    f.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => done({ v: b.dataset.v, show: b.dataset.show || b.textContent })));
    document.getElementById('bk')?.addEventListener('click', () => { sfx('flip'); goQ(i - 1); });
  })();
}
function wait(ms) { return new Promise(r => setTimeout(r, reduce ? 0 : ms)); }
function ln() { return document.getElementById('ln'); }
function on(id, fn) { document.getElementById(id).addEventListener('click', fn); }
function val(id) { return document.getElementById(id).value; }
function err(m) { document.getElementById('er').textContent = m; }
function form(fn) { document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); fn(); }); }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function next(n, sound = 'flip') { sfx(sound); S.step = n; STEPS[n](); }
document.getElementById('restart').addEventListener('click', () => { Object.assign(S, { cal: 'solar', leap: false, lb: null, wk: '', orient: '', job: '', worry: '', time: '13:00', sex: '남자', name: '태준', y: 1989, m: 3, d: 18, fast: false, hour: '', noTime: false, status: '' }); panel.classList.remove('tall'); document.getElementById('toon')?.remove(); document.getElementById('pro')?.remove(); next(0); });

// ---- drifting gold dust ----
(function dust() {
  const c = document.getElementById('dust'), x = c.getContext('2d'); let W, H, P = [];
  function size() { const r = c.getBoundingClientRect(); W = c.width = r.width * devicePixelRatio; H = c.height = r.height * devicePixelRatio; }
  size(); addEventListener('resize', size);
  for (let i = 0; i < 46; i++) P.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .4, v: Math.random() * .00035 + .0001, a: Math.random() * Math.PI * 2 });
  function f() {
    x.clearRect(0, 0, W, H);
    for (const p of P) {
      p.y -= p.v; p.a += .01; if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
      const al = .35 + .35 * Math.sin(p.a);
      x.beginPath(); x.arc((p.x + Math.sin(p.a) * .01) * W, p.y * H, p.r * devicePixelRatio, 0, 7);
      x.fillStyle = `rgba(240,210,147,${al})`; x.fill();
    }
    if (!reduce) requestAnimationFrame(f);
  }
  f();
})();
